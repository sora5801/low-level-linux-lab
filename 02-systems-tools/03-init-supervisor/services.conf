# services.conf — sample service file for the init supervisor.
#
# Format (see config.c for the full grammar):
#   [name]                          begins a service block
#   exec = /path/to/prog arg1 arg2  the command line (split on spaces; no shell
#                                   quoting — wrap complex commands in sh -c)
#   after = dep1 dep2               start these services first (ordering only)
#   restart = always|on-failure|no  default is on-failure
#
# The services below are chosen so you can watch every behaviour of the
# supervisor with nothing but coreutils:
#   - dependency ordering (web starts after logger),
#   - a clean long-running service (logger),
#   - a crash loop that exercises exponential backoff (flapper),
#   - a one-shot task that runs once and is not restarted (oneshot).

[logger]
# A stand-in "logging daemon": prints a line, then sleeps forever. `exec sleep`
# replaces the shell so there is no extra shell process lingering as PID owner.
exec = /bin/sh -c "echo logger: up; exec sleep 86400"
restart = always

[web]
# Ordered AFTER logger, so the supervisor starts logger first. (Ordering only —
# it does not wait for logger to be "ready"; that would need a readiness signal.)
after = logger
exec = /bin/sh -c "echo web: up (logger started first); exec sleep 86400"
restart = always

[flapper]
# Exits non-zero almost immediately, forever. Watch the log: the restart delay
# doubles 100ms -> 200ms -> 400ms ... up to the 30s cap. This is the backoff
# routine (order.c / asm/demo.annotated.s) working in real time.
exec = /bin/sh -c "echo flapper: crashing; exit 1"
restart = on-failure

[oneshot]
# Runs once and exits 0. With restart=no it is NOT brought back — a migration or
# warm-up task. (With the default on-failure it also would not restart on a
# clean exit; `no` makes the intent explicit.)
exec = /bin/sh -c "echo oneshot: did my one job; exit 0"
restart = no
